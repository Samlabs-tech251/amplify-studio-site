<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060D" />
    <title>Amplify Studio — Offline</title>
    <style>
      :root { color-scheme: dark; --ink: #07060D; --surface: #1B1030; --gold: #D4A24C; --bright: #E9C77E; --cream: #F2E9DA; --mauve: #A39AB3; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; padding: 28px; background: var(--ink); color: var(--cream); font-family: Arial, sans-serif; display: grid; place-items: center; text-align: center; }
      main { width: min(100%, 430px); padding: 48px 28px; border: 1px solid rgba(212,162,76,.35); border-radius: 24px; background: radial-gradient(circle at 50% 0%, rgba(212,162,76,.17), transparent 42%), rgba(27,16,48,.8); box-shadow: inset 0 1px 0 rgba(242,233,218,.1), 0 22px 60px rgba(0,0,0,.35); }
      .wordmark { margin: 0 auto 30px; font-family: Georgia, serif; line-height: .86; letter-spacing: -.06em; }
      .wordmark strong { display: block; color: var(--gold); font-size: 42px; font-weight: 700; }
      .wordmark span { display: block; margin: 8px 0 0 21px; color: var(--cream); font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
      .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 11px 4px rgba(212,162,76,.6); }
      p { margin: 0; }.eyebrow { color: var(--bright); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 16px 0 12px; font-family: Georgia, serif; font-size: clamp(40px, 12vw, 68px); font-weight: 400; letter-spacing: -.05em; line-height: .95; } h1 em { color: var(--bright); }
      .copy { color: var(--mauve); font-size: 15px; line-height: 1.6; }.retry { display: inline-block; margin-top: 28px; padding: 13px 18px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark" aria-label="Amplify Studio"><strong>Amplify</strong><span>Studio<i class="dot"></i></span></div>
      <p class="eyebrow">Signal paused</p>
      <h1>You&apos;re <em>offline.</em></h1>
      <p class="copy">The connection dropped, but the studio is still here. Check your network and try again when you&apos;re ready.</p>
      <a class="retry" href="./">Try again</a>
    </main>
  </body>
</html>
