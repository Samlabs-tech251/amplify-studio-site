<style>
  #ams-chat, #ams-chat * { box-sizing: border-box; }
  #ams-chat {
    /* ---- palette: change these to match the site ---- */
    --ams-bg: #000000;
    --ams-surface: #0A0A0A;
    --ams-surface-2: #111111;
    --ams-line: rgba(255, 255, 255, .09);
    --ams-text: #FFFFFF;
    --ams-muted: #A3A3A3;
    --ams-accent: #C6F51D;
    --ams-accent-2: #7F9E0F;
    --ams-on-accent: #000000;
    --ams-online: #34d399;
    --ams-font: inherit;
    --ams-display: "Playfair Display", Georgia, serif;
    --ams-lift: 0px;
    /* ------------------------------------------------- */
    --ams-grad: linear-gradient(135deg, var(--ams-accent), var(--ams-accent-2));
    font-family: var(--ams-font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ams-text);
  }
  #ams-chat button, #ams-chat input { font-family: inherit; }

  /* Launcher */
  #ams-chat .ams-launcher {
    position: fixed; right: 20px; bottom: calc(20px + var(--ams-lift) + env(safe-area-inset-bottom, 0px));
    width: 60px; height: 60px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--ams-grad); color: var(--ams-on-accent); z-index: 2147483000;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  #ams-chat .ams-launcher:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 12px 30px rgba(0, 0, 0, .32); }
  #ams-chat .ams-launcher:active { transform: scale(.96); }
  #ams-chat .ams-launcher::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--ams-accent); opacity: 0;
    animation: none;
  }
  #ams-chat .ams-launcher svg { width: 26px; height: 26px; position: absolute; transition: transform .25s ease, opacity .2s ease; }
  #ams-chat .ams-ico-close { opacity: 0; transform: rotate(-90deg) scale(.6); }
  #ams-chat.ams-is-open .ams-ico-chat { opacity: 0; transform: rotate(90deg) scale(.6); }
  #ams-chat.ams-is-open .ams-ico-close { opacity: 1; transform: none; }
  #ams-chat .ams-badge {
    position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: #C6F51D; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--ams-bg);
  }
  #ams-chat .ams-badge[hidden] { display: none; }
  @keyframes ams-ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.8); opacity: 0; } }

  /* Teaser bubble */
  #ams-chat .ams-teaser {
    position: fixed; right: 20px; bottom: calc(92px + var(--ams-lift) + env(safe-area-inset-bottom, 0px));
    max-width: 260px; padding: 12px 34px 12px 14px; border-radius: 14px 14px 4px 14px;
    background: var(--ams-surface-2); color: var(--ams-text); border: 1px solid var(--ams-line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); z-index: 2147483000; cursor: pointer;
    display: none; animation: ams-pop .35s ease both;
  }
  #ams-chat .ams-teaser.ams-show { display: block; }
  #ams-chat .ams-teaser-x {
    position: absolute; top: 4px; right: 6px; background: transparent; border: 0;
    color: var(--ams-muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  }

  /* Panel */
  #ams-chat .ams-panel {
    position: fixed; right: 20px; bottom: calc(92px + var(--ams-lift) + env(safe-area-inset-bottom, 0px));
    width: 380px; max-width: calc(100vw - 24px);
    height: 580px; max-height: calc(100vh - 116px - var(--ams-lift)); max-height: calc(100dvh - 116px - var(--ams-lift));
    background: #000000;
    border: 1px solid var(--ams-line); border-radius: 20px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(201, 162, 74, .12);
    display: none; flex-direction: column; z-index: 2147483000; transform-origin: bottom right;
  }
  #ams-chat .ams-panel.ams-open { display: flex; animation: ams-pop .28s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes ams-pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

  /* Header */
  #ams-chat .ams-head {
    display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px;
    background: rgba(255, 255, 255, .03); border-bottom: 1px solid var(--ams-line);
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  #ams-chat .ams-avatar {
    position: relative; flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--ams-grad);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; font-family: var(--ams-display); font-style: italic; color: var(--ams-on-accent);
  }
  #ams-chat .ams-avatar::after {
    content: ""; position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--ams-online); border: 2px solid var(--ams-bg);
  }
  #ams-chat .ams-who { flex: 1; min-width: 0; }
  #ams-chat .ams-title { font-family: var(--ams-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
  #ams-chat .ams-sub { font-size: 12.5px; color: var(--ams-muted); margin-top: 2px; }
  #ams-chat .ams-iconbtn {
    flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--ams-line);
    background: transparent; color: var(--ams-text); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, border-color .15s ease; text-decoration: none;
  }
  #ams-chat .ams-iconbtn:hover { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); }
  #ams-chat .ams-iconbtn svg { width: 18px; height: 18px; }

  /* Messages */
  #ams-chat .ams-log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; overscroll-behavior: contain; }
  #ams-chat .ams-log::-webkit-scrollbar { width: 6px; }
  #ams-chat .ams-log::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 3px; }
  #ams-chat .ams-msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; animation: ams-in .22s ease both; }
  @keyframes ams-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #ams-chat .ams-bot { align-self: flex-start; background: var(--ams-surface-2); border: 1px solid var(--ams-line); border-bottom-left-radius: 5px; }
  #ams-chat .ams-user { align-self: flex-end; background: var(--ams-grad); color: var(--ams-on-accent); border-bottom-right-radius: 5px; }
  #ams-chat .ams-msg a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  #ams-chat .ams-cta {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-radius: 999px; background: #C6F51D; color: #000000; font-weight: 700; font-size: 14px; text-decoration: none;
    animation: ams-in .22s ease both; transition: transform .15s ease, filter .15s ease;
  }
  #ams-chat .ams-cta:hover { transform: translateY(-1px); filter: none; }
  #ams-chat .ams-dots { display: inline-flex; gap: 5px; align-items: center; height: 20px; }
  #ams-chat .ams-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ams-muted); animation: ams-bounce 1s infinite ease-in-out; }
  #ams-chat .ams-dots i:nth-child(2) { animation-delay: .15s; }
  #ams-chat .ams-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes ams-bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* Quick replies */
  #ams-chat .ams-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 10px; }
  #ams-chat .ams-chips[hidden] { display: none; }
  #ams-chat .ams-chip {
    background: transparent; color: var(--ams-text); border: 1px solid rgba(201, 162, 74, .5);
    border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  #ams-chat .ams-chip:hover { background: rgba(201, 162, 74, .18); border-color: var(--ams-accent); transform: translateY(-1px); }

  /* Composer */
  #ams-chat .ams-form { display: flex; gap: 8px; padding: 10px 12px 6px; border-top: 1px solid var(--ams-line); background: rgba(255, 255, 255, .02); }
  #ams-chat .ams-input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; font-size: 15px;
    background: var(--ams-surface); color: var(--ams-text); border: 1px solid var(--ams-line);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #ams-chat .ams-input::placeholder { color: var(--ams-muted); }
  #ams-chat .ams-input:focus { outline: none; border-color: var(--ams-accent); box-shadow: 0 0 0 3px rgba(201, 162, 74, .20); }
  #ams-chat .ams-send {
    flex: none; width: 46px; border: 0; border-radius: 12px; background: var(--ams-grad); color: var(--ams-on-accent); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .15s ease, opacity .15s ease;
  }
  #ams-chat .ams-send:hover:not(:disabled) { transform: scale(1.05); }
  #ams-chat .ams-send:disabled { opacity: .4; cursor: not-allowed; }
  #ams-chat .ams-send svg { width: 20px; height: 20px; }
  #ams-chat .ams-note { padding: 0 14px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; color: var(--ams-muted); text-align: center; }

  #ams-chat button:focus-visible, #ams-chat a:focus-visible { outline: 3px solid #D9FF4A; outline-offset: 2px; }

  /* Clear the site's bottom navigation dock on small screens */
  @media (max-width: 768px) { #ams-chat { --ams-lift: 84px; } }

  /* Phones: full-screen sheet */
  @media (max-width: 480px) {
    #ams-chat .ams-panel { inset: 0; width: auto; max-width: none; height: auto; max-height: none; border-radius: 0; border: 0; }
    #ams-chat .ams-head { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    #ams-chat.ams-is-open .ams-launcher { display: none; }
    #ams-chat .ams-input { font-size: 16px; }
    #ams-chat .ams-teaser { right: 16px; max-width: calc(100vw - 100px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #ams-chat *, #ams-chat *::before { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

</div>

    { id: "business-overview", triggers: ["what does amplify studio do", "what is amplify studio", "business overview", "what kind of business", "what is your tagline"], answer: "Amplify Studio is a creative design and digital marketing agency in Lagos. It helps small businesses look credible and grow online with design, video, content and websites.", related: ["Who runs Amplify Studio?", "Where are you based?", "What services do you offer?"] },

    { id: "advanced-site", triggers: ["what is the advanced site", "advanced website", "advanced site"], answer: "It is the Cinematic design plus online ordering or booking, or an AI chatbot for customer questions. It is quoted per project based on scope.", handoff: true, related: ["Do you do online ordering?", "How much is a website?", "Can I get a custom quote?"] },
    { id: "ordering-booking-chatbot", triggers: ["do you build online ordering booking or chatbots", "do you do online ordering", "online ordering", "online booking", "website chatbot"], answer: "Yes, these come with the Advanced Site, which is priced per project. Contact the team on WhatsApp or email for a quote.", handoff: true, related: ["What is the Advanced Site?", "How much is a website?", "Can I get a custom quote?"] },
    { id: "care-plan", triggers: ["do you offer website maintenance", "care plan", "website maintenance", "how much is the care plan", "maintenance cost"], answer: "Yes. The care plan costs 10,000 to 25,000 naira a month and covers updates, hosting help and backups.", related: ["Is a domain included?", "How much is a website?", "How can I contact you?"] },
    { id: "domain", triggers: ["is a domain included", "domain cost", "how much is a domain", "custom domain"], answer: "The Business Site and Cinematic Site include a custom domain. The domain itself costs about 15,000 naira a year, billed at cost.", related: ["What is included in the Business Site?", "What is included in the Cinematic Site?", "How much is a website?"] },
    { id: "start", triggers: ["how do i start a project", "how do i get started", "start a project", "begin a project", "i want to start"], answer: "Message us on WhatsApp or email with what you need. The team will advise on the right package and next steps.", handoff: true, related: ["What services do you offer?", "How much is a website?", "How can I contact you?"] },
    { id: "turnaround", triggers: ["how long will my project take", "turnaround time", "how long does it take", "delivery time", "project timeline"], answer: "For creative packages: Starter takes 3 to 5 working days, Professional 7 to 10 working days, and Premium 14 to 21 working days or a timeline agreed per project. The clock starts when payment is confirmed and all materials are received. For websites, the team confirms the timeline after discussing the project.", related: ["How do I pay?", "How many revisions do I get?", "Which package should I choose?"] },
    { id: "payment", triggers: ["how do i pay", "payment terms", "do i have to pay a deposit", "pay in instalments", "payment"], answer: "For creative packages, Starter is paid in full before work begins, and Professional and Premium need a 50 percent deposit with the balance paid before final files are released. For websites, it is 50 percent upfront and the rest on delivery. The team shares payment details on WhatsApp or email.", handoff: true, related: ["How many revisions do I get?", "What is your refund policy?", "How do I start a project?"] },
    { id: "revisions", triggers: ["how many revisions do i get", "revisions", "revision rounds", "extra revisions"], answer: "For creative packages, Starter includes 1 revision round, Professional 2 and Premium 3. Extra revisions are quoted separately. For websites, the team confirms the revisions once the scope is agreed.", related: ["How long will my project take?", "How much are your creative packages?", "How do I start a project?"] },
    { id: "refund", triggers: ["what is your refund policy", "refund", "refund policy", "can i cancel my order", "cancel my order", "deposit refundable"], answer: "Cancel before work starts and you get a full refund. Once work has started, deposits are not refundable because the work is custom. If we cannot deliver the agreed work, you are refunded for the undelivered part.", handoff: true, related: ["How do I pay?", "How many revisions do I get?", "How can I contact you?"] },
    { id: "portfolio", triggers: ["can i see examples of your work", "portfolio", "see your work", "examples of your work"], answer: "Yes. Open the Portfolio section on our website: https://samlabs-tech251.github.io/amplify-studio-site/", related: ["What services do you offer?", "How do I start a project?", "How can I contact you?"] },
    { id: "custom-quote", triggers: ["can i get a custom quote", "custom quote", "something different", "outside the packages"], answer: "Yes, the team can discuss custom needs. Contact us on WhatsApp or email.", handoff: true, related: ["What services do you offer?", "How much is a website?", "How do I start a project?"] },
    { id: "discounts", triggers: ["do you offer discounts", "discount", "cheaper price"], answer: "Pricing is as listed. For anything else, the team confirms on WhatsApp or email.", related: ["How much are your creative packages?", "How much is a website?", "Can I get a custom quote?"] },
    { id: "outside-lagos", triggers: ["do you work with businesses outside lagos", "outside lagos", "work in another location"], answer: "Amplify Studio is based in Lagos. For availability for your location, contact the team on WhatsApp or email.", related: ["Where are you based?", "How can I contact you?", "Can I get a custom quote?"] }
  ];

  var root = document.getElementById("ams-chat");
  var $ = function (s) { return root.querySelector(s); };
  var launcher = $(".ams-launcher"), panel = $(".ams-panel"), closeBtn = $(".ams-close");
  var log = $(".ams-log"), chips = $(".ams-chips"), form = $(".ams-form");
  var input = $(".ams-input"), sendBtn = $(".ams-send"), wa = $(".ams-wa");
  var badge = $(".ams-badge"), teaser = $(".ams-teaser"), teaserX = $(".ams-teaser-x");
  var waLink = "https://wa.me/" + CONFIG.whatsapp;
  wa.href = waLink;
  $(".ams-teaser-text").textContent = CONFIG.teaser;

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var phone = function () { return window.matchMedia && window.matchMedia("(max-width: 480px)").matches; };
  function store(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  var sessionId = load("ams_session");
  if (!sessionId) { sessionId = "web-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store("ams_session", sessionId); }
  var history = [];
  try { history = JSON.parse(load("ams_history") || "[]"); } catch (e) { history = []; }
  if (!Array.isArray(history)) history = [];
  function saveHistory() { store("ams_history", JSON.stringify(history.slice(-30))); }
  var busy = false, lastSend = 0;

  function addText(el, text) {
    var re = /(https?:\/\/[^\s<>"つ]+[^\s<>".,;:!?)])/g, last = 0, m;
    while ((m = re.exec(text)) !== null) { if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index))); var a = document.createElement("a"); a.href = m[0]; a.textContent = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer"; el.appendChild(a); last = m.index + m[0].length; }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }
  function scrollDown() { log.scrollTop = log.scrollHeight; }
  function bubble(text, who) { var el = document.createElement("div"); el.className = "ams-msg " + (who === "user" ? "ams-user" : "ams-bot"); addText(el, text); log.appendChild(el); scrollDown(); return el; }
  function ctaButton() { var a = document.createElement("a"); a.className = "ams-cta"; a.href = waLink; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Continue on WhatsApp"; log.appendChild(a); scrollDown(); }
  function typing() { var el = document.createElement("div"); el.className = "ams-msg ams-bot"; el.innerHTML = '<span class="ams-dots" aria-label="Typing"><i></i><i></i><i></i></span>'; log.appendChild(el); scrollDown(); return el; }
  function reveal(el, text, done) { if (reduced || text.length > 700) { el.textContent = ""; addText(el, text); scrollDown(); done(); return; } var parts = text.split(/(\s+)/), i = 0, per = Math.max(10, Math.min(35, 1400 / parts.length)); el.textContent = ""; (function step() { if (i >= parts.length) { el.textContent = ""; addText(el, text); scrollDown(); done(); return; } el.textContent += parts[i++]; scrollDown(); setTimeout(step, per); })(); }

  function normalize(text) { return (text || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
  function distance(a, b) { var prev = [], cur = [], i, j; for (j = 0; j <= b.length; j++) prev[j] = j; for (i = 1; i <= a.length; i++) { cur[0] = i; for (j = 1; j <= b.length; j++) cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur.slice(); } return prev[b.length]; }
  function scoreTrigger(query, trigger) {
    var q = normalize(query), t = normalize(trigger); if (!q || !t) return 0;
    if (q === t) return 1.25; if (q.indexOf(t) >= 0 || t.indexOf(q) >= 0) return .98;
    var qt = q.split(" "), tt = t.split(" "), hits = 0;
    tt.forEach(function (word) { if (qt.some(function (candidate) { return candidate === word || (word.length > 3 && distance(candidate, word) <= (word.length > 6 ? 2 : 1)); })) hits++; });
    if (tt.length > 1 && hits < 2) return 0;
    var overlap = hits / tt.length; var bonus = qt.some(function (word) { return t.indexOf(word) >= 0 && word.length > 4; }) ? .08 : 0;
    return overlap * .84 + bonus;
  }
  function isAmbiguousPackage(query) {
    var q = normalize(query), hasCreative = /(creative|flyer|flyers|video|videos|poster|posters|logo|graphic|graphics|deliverable|revision)/.test(q), hasWebsite = /(website|site|web|ordering|booking|domain|hosting|care plan|chatbot)/.test(q);
    return /\b(starter|professional|premium)\b/.test(q) && !/\b(starter site|business site|cinematic site|advanced site)\b/.test(q) && !hasCreative && !hasWebsite;
  }
  function findAnswer(query) {
    var q = normalize(query);
    if (/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(q)) return { answer: "Hi, welcome to Amplify Studio. Ask me about our services, packages, or how to get started.", related: CONFIG.quickReplies.slice(0, 3) };
    if (/^(thanks|thank you|thx)\b/.test(q)) return { answer: "You’re welcome. Is there anything else I can help with?", related: CONFIG.quickReplies.slice(0, 3) };
    if (/^(bye|goodbye|see you)\b/.test(q)) return { answer: "Thank you. Message us on WhatsApp whenever you are ready.", related: ["How do I get started?", "How can I contact you?"] };
    if (/(angry|upset|complain|complaint|dispute)/.test(q) && /payment|refund|deposit|money|charge/.test(q)) return { answer: "Refund requests and disputes are handled by the team directly on WhatsApp or email.", handoff: true, related: ["What is your refund policy?", "How do I pay?", "How can I contact you?"] };
    if (isAmbiguousPackage(q)) return { answer: "Do you mean our creative packages for videos and flyers, or a website package?", related: ["How much are your creative packages?", "How much is a website?"] };
    var ranked = ENTRIES.map(function (entry) { return { entry: entry, score: Math.max.apply(Math, entry.triggers.map(function (trigger) { return scoreTrigger(q, trigger); })) }; }).sort(function (a, b) { return b.score - a.score; });
    if (!ranked.length || ranked[0].score < .42) return { answer: CONFIG.errorMessage, related: CONFIG.quickReplies.slice(-3), handoff: false };
    var best = ranked[0].entry, related = (best.related || []).slice(0, 3);
    if (ranked[1] && ranked[1].score >= ranked[0].score - .12 && ranked[1].score >= .55) { var alternate = ranked[1].entry.related && ranked[1].entry.related[0]; if (alternate && related.indexOf(alternate) < 0) related[related.length - 1] = alternate; }
    return { answer: best.answer, related: related, handoff: !!best.handoff };
  }
  function renderChips(items) { chips.innerHTML = ""; items = (items || []).filter(Boolean).slice(0, 3); if (!items.length) { chips.hidden = true; return; } chips.hidden = false; items.forEach(function (q) { var b = document.createElement("button"); b.type = "button"; b.className = "ams-chip"; b.textContent = q; b.addEventListener("click", function () { send(q); }); chips.appendChild(b); }); }

  function hideTeaser() { teaser.classList.remove("ams-show"); store("ams_teaser", "1"); }
  function openPanel() { panel.classList.add("ams-open"); root.classList.add("ams-is-open"); launcher.setAttribute("aria-expanded", "true"); launcher.setAttribute("aria-label", "Close chat"); badge.hidden = true; store("ams_seen", "1"); hideTeaser(); if (phone()) document.body.style.overflow = "hidden"; if (!log.children.length) { history = [{ who: "bot", text: CONFIG.greeting }]; saveHistory(); bubble(CONFIG.greeting, "bot"); } renderChips(CONFIG.quickReplies.slice(0, 3)); scrollDown(); if (!phone()) setTimeout(function () { input.focus(); }, 60); }
  function closePanel() { panel.classList.remove("ams-open"); root.classList.remove("ams-is-open"); launcher.setAttribute("aria-expanded", "false"); launcher.setAttribute("aria-label", "Open chat"); document.body.style.overflow = ""; launcher.focus(); }
  launcher.addEventListener("click", function () { panel.classList.contains("ams-open") ? closePanel() : openPanel(); }); closeBtn.addEventListener("click", closePanel); teaser.addEventListener("click", function (e) { if (e.target !== teaserX) openPanel(); }); teaserX.addEventListener("click", function (e) { e.stopPropagation(); hideTeaser(); }); root.addEventListener("keydown", function (e) { if (e.key === "Escape" && panel.classList.contains("ams-open")) closePanel(); });

  history.forEach(function (h) { if (h.cta) ctaButton(); else bubble(h.text, h.who); }); log.querySelectorAll(".ams-msg, .ams-cta").forEach(function (n) { n.style.animation = "none"; });
  if (!load("ams_seen")) badge.hidden = false;
  if (!load("ams_teaser")) setTimeout(function () { if (!panel.classList.contains("ams-open") && !load("ams_teaser")) { teaser.classList.add("ams-show"); setTimeout(function () { teaser.classList.remove("ams-show"); }, 12000); } }, CONFIG.teaserDelayMs);

  function send(text) {
    text = (text || "").trim(); if (!text || busy) return; if (Date.now() - lastSend < 500) return; lastSend = Date.now(); busy = true; sendBtn.disabled = true; input.value = ""; history.push({ who: "user", text: text }); saveHistory(); bubble(text, "user"); chips.hidden = true; var dots = typing(); var result = findAnswer(text);
    setTimeout(function () { dots.remove(); var el = bubble("", "bot"); reveal(el, result.answer, function () { history.push({ who: "bot", text: result.answer }); if (result.handoff) { ctaButton(); history.push({ who: "bot", text: "", cta: true }); } saveHistory(); renderChips(result.related); busy = false; sendBtn.disabled = false; if (!phone()) input.focus(); }); }, reduced ? 400 : 400 + Math.floor(Math.random() * 301));
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
})();
</script>
